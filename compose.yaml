# 開発用。Rails と Vite はコンテナ内で動かし、ソースだけホストからマウントする。
services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      TZ: Asia/Tokyo
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./docker/api
      dockerfile: Dockerfile.dev
    command: >
      bash -c "
        bundle check || bundle install &&
        rm -f tmp/pids/server.pid &&
        bin/rails server -b 0.0.0.0 -p 3000
      "
    tty: true
    stdin_open: true
    volumes:
      - ./api:/app
      - bundle_data:/usr/local/bundle
    env_file:
      - .env
    environment:
      TZ: Asia/Tokyo
      RAILS_ENV: development
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./docker/web
      dockerfile: Dockerfile.dev
    command: >
      sh -c "
        npm install &&
        npm run dev -- --host 0.0.0.0 --port 5173
      "
    tty: true
    stdin_open: true
    volumes:
      - ./web:/app
      - node_modules_data:/app/node_modules
    environment:
      TZ: Asia/Tokyo
    ports:
      - "5173:5173"

  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  postgres_data:
  bundle_data:
  node_modules_data:
